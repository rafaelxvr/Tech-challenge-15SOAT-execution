#
# Aceite temporário (UNR-839), decisão do operador em 05/11/2026, sujeito ao parecer do SecurityEngineer.
# Componente: org.springframework:spring-webmvc 6.2.19 (Spring Boot 3.5.16, última 6.2.x publicada no Maven Central).
# Motivo: a correção existe apenas na linha 7.0.x (Spring Framework 7 / Boot 4); migrar não cabe antes de 17/11.
# Mitigação: o execution-service é uma API REST pura (verificado por busca no código e no pom.xml: sem XsltView, ModelAndView, ViewResolver,
#   SseEmitter, text/event-stream nem starter de template).
# Expiração: 30/11/2026 (a entrada deixa de valer sozinha). Follow-up: migrar para Spring Boot 4.x.
