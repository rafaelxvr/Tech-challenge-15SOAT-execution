# Estende as regras padrão do Gitleaks. Exceções mínimas e auditáveis (UNR-616), restritas por linha:
# 1) checksum SHA-256 público do agente Java do New Relic (não é credencial; casa com a regra new-relic-user-api-id);
# 2) chave fictícia usada só pelo teste de entrypoint (scripts/tests/entrypoint-observability.test.sh).
title = "execution-service"

[extend]
useDefault = true

[allowlist]
description = "Checksum público do agente New Relic e chave fictícia do teste de entrypoint"
regexTarget = "line"
regexes = [
  '''NEW_RELIC_JAVA_AGENT_SHA256=[0-9a-f]{64}''',
  '''NEW_RELIC_LICENSE_KEY=segredo-ficticio-123''',
]
