apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execution
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      serviceAccountName: oficina-execution
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: execution
          # Tag substituída por digest/SHA em scripts/kind-deploy.sh; nunca `latest` como contrato.
          image: oficina-execution:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: oficina-execution-config}
          env:
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: oficina-execution-secrets, key: staff_hmac_secret}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: {path: /execucao/actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /execucao/actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /execucao/actuator/health/liveness, port: http}
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
