name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, feat/execution-service, "feat/unr-67-*"]

permissions:
  contents: read

concurrency:
  group: execution-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Java 17)
    runs-on: ubuntu-latest
    env:
      # Identificador do conjunto de contratos v1 (sha256 de contracts/CONTRACTS.sha256); igual nos tres repositorios.
      CONTRACT_SET_SHA256: 35d863ecc103d4b4ff271004ac21626cbead715de008479381810cb57440e5b0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify
        run: bash ./mvnw -B verify

      - name: Resumo de cobertura JaCoCo
        if: always()
        run: |
          awk -F, 'NR>1 {m+=$8; c+=$9; bm+=$6; bc+=$7} END {if (m+c>0) printf "Cobertura de linhas: %.2f%% (minimo 80%%)\nCobertura de branches: %.2f%%\n", 100*c/(m+c), 100*bc/(bm+bc)}' target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"

  sast-codeql:
    name: SAST (CodeQL Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compile (sem testes)
        run: bash ./mvnw -B -DskipTests -Djacoco.skip=true package

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:java-kotlin

  sca-trivy:
    name: SCA (Trivy, dependências Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy fs (falha em HIGH/CRITICAL com correção disponível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: pom.xml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivy-config: trivy.yaml
          exit-code: '1'
          format: table

  secrets-gitleaks:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (histórico completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (falha ao achar segredo)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifests-contract:
    name: Contrato dos manifests (S-10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Contrato offline dos manifests Kind e do Dockerfile
        run: bash scripts/tests/kind-manifests-contract.test.sh

  # Quality gate do SonarCloud (UNR-618). Ativo com a variável de repositório SONAR_ENABLED=true
  # ou por execução manual (workflow_dispatch). Quando ativo, não há skip silencioso: sem
  # SONAR_TOKEN o job FALHA com mensagem explícita.
  # Organização e chave do projeto ficam no pom.xml (não secretas); só o token é secret.
  # PR vindo de fork não recebe secrets e fica fora do gate.
  sonar:
    name: SonarCloud e quality gate
    if: ${{ (vars.SONAR_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SONAR_MAVEN_PLUGIN: org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121
    steps:
      - name: Checkout (SHA ${{ github.sha }})
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Exigir configuração do SonarCloud (falha, nunca ignora)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +x
          faltando=0
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Secret SONAR_TOKEN ausente. Cadastre-o em Settings > Secrets and variables > Actions ou desative o gate com SONAR_ENABLED=false."
            faltando=1
          fi
          exit "$faltando"

      # verify gera o JaCoCo XML (target/site/jacoco/jacoco.xml) lido pelo scanner.
      # qualitygate.wait faz o job falhar se o quality gate reprovar. O token só vai por env, nunca para o log.
      - name: Análise e espera do quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +x
          bash ./mvnw -B -q verify "${SONAR_MAVEN_PLUGIN}:sonar"             -Dsonar.host.url=https://sonarcloud.io               -Dsonar.qualitygate.wait=true             -Dsonar.qualitygate.timeout=600

      - name: Evidência do quality gate (SHA ${{ github.sha }})
        if: always()
        run: |
          set +x
          {
            echo "### SonarCloud"
            echo "- Commit analisado: \`${GITHUB_SHA}\`"
            echo "- Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -f target/sonar/report-task.txt ]; then
              echo "- Painel: $(grep '^dashboardUrl=' target/sonar/report-task.txt | cut -d= -f2-)"
            else
              echo "- Painel: indisponível (a análise não chegou a publicar)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
